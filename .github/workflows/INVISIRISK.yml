name: php build

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write

jobs:
  php-application-build:
    runs-on: ubuntu-latest
    name: Run build with anomalies

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install project dependencies
        run: composer install

  intentional-failure:
    runs-on: ubuntu-latest
    name: Intentional failing job

    steps:


      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail the job intentionally
        run: |
          echo "This job is intentionally failing for testing."
          exit 1
